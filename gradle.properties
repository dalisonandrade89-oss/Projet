org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# "dono/repositorio" do GitHub usado pelo auto-update (BuildConfig.GITHUB_REPO).
# No CI é sobrescrito automaticamente com -PgithubRepo=${{ github.repository }}.
githubRepo=dalisonandrade89-oss/projet

# Versão do app (fonte única). Atualizada a cada mudança significativa — veja CHANGELOG.md.
# No CI de release é sobrescrita pela tag (-PversionName) e pelo run number (-PversionCode).
versionName=1.1.0
versionCode=2
