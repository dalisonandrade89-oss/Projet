name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]          # ex.: git tag v1.0.0 && git push origin v1.0.0
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write         # necessário para criar Releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validar e compilar (Debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Lint + testes unitários + APK debug
        run: gradle lintDebug testDebugUnitTest assembleDebug -PgithubRepo=${{ github.repository }} --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: projet-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Publicar Release (APK assinado)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restaurar keystore dos Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 ausente: o APK será assinado com a chave debug e o auto-update NÃO funcionará entre releases."
          fi

      - name: Definir versão a partir da tag
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Compilar APK Release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          gradle assembleRelease
          -PversionName=$VERSION_NAME
          -PversionCode=$VERSION_CODE
          -PgithubRepo=${{ github.repository }}
          --stacktrace

      - name: Renomear APK
        run: mv app/build/outputs/apk/release/*.apk "Projet-v${VERSION_NAME}.apk"

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Projet-v*.apk
          generate_release_notes: true
